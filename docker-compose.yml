services:
  db:
    image: postgres:17
    container_name: gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_pass
      POSTGRES_DB: gym_db
    ports:
      - '5432:5432'
    volumes:
      - gym_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gym -d gym_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gym_postgres:
